version: '3.8'

services:
  hermes_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/ai-scientist_hermes_api:latest
    container_name: ai_scientist_agents
    ports:
      - "8500:8500"
    environment:
      - CHROMA_HOST=chromadb
      - OLLAMA_URL=${OLLAMA_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - HF_HOME=/app/chroma_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - .:/app
      - sqlite_data:/app/db_data
      - chroma_cache:/app/chroma_cache
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    depends_on:
      - chromadb
    networks:
      - hermes-net

  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: ai_scientist_agents_chromadb
    volumes:
      - chroma_data:/chroma
    ports:
      - "8000:8000"
    networks:
      - hermes-net

  hermes_ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/ai-scientist_hermes_api:latest
    container_name: ai_scientist_ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - sqlite_data:/app/db_data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
    command: streamlit run ui.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - hermes_api
    networks:
      - hermes-net

volumes:
  chroma_data:
  sqlite_data:
  chroma_cache:

networks:
  hermes-net:
    driver: bridge