version: '3.8'

services:
  hermes_api:
    image: localhost/ai-scientist_hermes_api:latest
    container_name: ai_scientist_agents
    ports:
      - "8500:8500"
    environment:
      - CHROMA_HOST=chromadb
      - OLLAMA_URL=${OLLAMA_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - HF_HOME=/app/chroma_cache  # <-- Tvingar ONNX/HuggingFace att använda denna mapp
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - .:/app
      - sqlite_data:/app/db_data
      - chroma_cache:/app/chroma_cache  # <-- Ändrad från /root/.cache till /app/chroma_cache
    depends_on:
      - chromadb
    networks:
      - hermes-net

  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: ai_scientist_agents_chromadb
    volumes:
      - chroma_data:/chroma
    ports:
      - "8000:8000"
    networks:
      - hermes-net

volumes:
  chroma_data:
  sqlite_data:
  chroma_cache:

networks:
  hermes-net:
    driver: bridge